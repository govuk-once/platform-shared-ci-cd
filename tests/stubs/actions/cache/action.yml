name: "Stub: actions/cache"
description: Local act stand-in for actions/cache. Logs its inputs and does nothing else.
inputs:
  path: { required: false }
  key: { required: false }
  restore-keys: { required: false }
outputs:
  cache-hit: { value: "false" }
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        echo "[stub] cache key=${{ inputs.key }}"
