name: "Stub: actions/setup-node"
description: Local act stand-in for actions/setup-node. Logs its inputs and does nothing else.
inputs:
  node-version: { required: false }
  cache: { required: false }
  cache-dependency-path: { required: false }
  registry-url: { required: false }

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        echo "[stub] setup-node node-version=${{ inputs.node-version }} (using the image node: $(node --version))"
