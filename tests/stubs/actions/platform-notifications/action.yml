name: "Stub: govuk-once/govuk-platform-notifications-gh-action"
description: Local act stand-in for govuk-once/govuk-platform-notifications-gh-action. Logs its inputs and does nothing else.
inputs:
  aws_account_id: { required: false }
  message_type: { required: false }
  title: { required: false }
  message: { required: false }
  repository: { required: false }
  tag: { required: false }
  slack_channel: { required: false }

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        echo "[stub] platform notification to ${{ inputs.slack_channel }}: ${{ inputs.title }}"
