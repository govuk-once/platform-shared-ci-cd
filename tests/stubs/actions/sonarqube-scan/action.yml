name: "Stub: SonarSource/sonarqube-scan-action"
description: Local act stand-in for SonarSource/sonarqube-scan-action. Logs its inputs and does nothing else.
inputs:
  projectBaseDir: { required: false }
  args: { required: false }

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        echo "[stub] sonarqube-scan host=${SONAR_HOST_URL:-} args=${{ inputs.args }}"
