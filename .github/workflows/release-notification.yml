name: Production Release Notification

on:
  workflow_call:
    inputs:
      application:
        required: true
        type: string
      version:
        required: true
        type: string
      type:
        required: true
        type: string
      slack-channel:
        required: true
        type: string
      aws-region:
        required: false
        type: string
        default: "eu-west-2"

    secrets:
      deployment-role:
        required: true
        description: "ARN of the IAM role to assume for deployment"

permissions:
  contents: read
  id-token: write

jobs:
  notify:
    name: Send production release notification

    # Patch releases and no-release runs are silently skipped.
    if: inputs.type == 'major' || inputs.type == 'minor'

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.deployment-role }}
          aws-region: ${{ inputs.aws-region }}
          role-session-name: release-notification-${{ github.run_id }}

      - name: Send release notification
        uses: govuk-once/platform-shared-ci-cd/actions/release-notification@test/consolidate-pipeline
        with:
          application: ${{ inputs.application }}
          version: ${{ inputs.version }}
          type: ${{ inputs.type }}
          slack-channel: ${{ inputs.slack-channel }}
