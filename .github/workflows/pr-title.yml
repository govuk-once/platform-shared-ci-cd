name: PR Title

# Validates the pull request title against a regular expression. Squash merges
# use the PR title as the commit message, so the title drives semantic-release.
# Optionally keeps a single guidance comment on the PR up to date.

on:
  workflow_call:
    inputs:
      pattern:
        description: >-
          Extended regular expression (grep -E) the PR title must match. The
          default requires `<JIRA-REF> <type>(<scope>)?: <description>`.
        required: false
        type: string
        default: '^[A-Z][A-Z0-9]+-[0-9]+ (feat|fix|chore|docs|style|refactor|test|perf|ci|build|revert)(\([^)]+\))?!?: .+'
      format:
        description: Human-readable format shown when the title is invalid.
        required: false
        type: string
        default: "<JIRA-REF> <type>(<scope>)?: <description>"
      examples:
        description: Example valid titles, one per line, shown in the PR comment.
        required: false
        type: string
        default: |
          ABC-123 feat: add user preferences endpoint
          ABC-456 fix(api): handle empty payload
          ABC-789 feat!: drop legacy auth
      guidance-url:
        description: Optional link to further guidance, included in the PR comment.
        required: false
        type: string
        default: ""
      skip-actors:
        description: Space-separated GitHub actors whose PRs are not checked.
        required: false
        type: string
        default: "dependabot[bot]"
      post-comment:
        description: Create or update a guidance comment on the PR.
        required: false
        type: boolean
        default: false

    outputs:
      valid:
        description: "`true` when the title is valid or the check was skipped; otherwise `false`."
        value: ${{ jobs.validate.outputs.valid }}

permissions:
  pull-requests: write

jobs:
  validate:
    name: Validate PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      valid: ${{ steps.validate.outputs.valid }}

    steps:
      - name: Validate PR title
        id: validate
        env:
          TITLE: ${{ github.event.pull_request.title }}
          PATTERN: ${{ inputs.pattern }}
          ACTOR: ${{ github.event.pull_request.user.login || github.actor }}
          SKIP_ACTORS: ${{ inputs.skip-actors }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          skip() {
            echo "::notice::$1"
            echo "valid=true" >> "$GITHUB_OUTPUT"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          case "${EVENT_NAME}" in
            pull_request|pull_request_target) ;;
            *) skip "Not a pull request event (${EVENT_NAME}); skipping PR title check." ;;
          esac

          for skip_actor in ${SKIP_ACTORS}; do
            [ "${ACTOR}" = "${skip_actor}" ] && skip "Skipping PR title check for ${ACTOR}."
          done

          echo "Checking PR title: ${TITLE}"
          if printf '%s' "${TITLE}" | grep -Eq -- "${PATTERN}"; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      - name: Update PR title guidance comment
        if: inputs.post-comment && steps.validate.outputs.skipped != 'true'
        # Fork PRs get a read-only token; a missing comment must not mask the result.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VALID: ${{ steps.validate.outputs.valid }}
          FORMAT: ${{ inputs.format }}
          EXAMPLES: ${{ inputs.examples }}
          GUIDANCE_URL: ${{ inputs.guidance-url }}
        run: |
          MARKER="<!-- pr-title-check -->"
          BODY_FILE="${RUNNER_TEMP}/pr-title-comment.md"

          if [ "${VALID}" = "true" ]; then
            printf '%s\n### ✅ Valid PR title\n\nThanks, this PR title follows the required format.\n' "${MARKER}" > "${BODY_FILE}"
          else
            {
              printf '%s\n### ❌ Invalid PR title\n\n' "${MARKER}"
              printf 'The PR title is used as the squash-merge commit message and drives semantic versioning, so it must follow this format:\n\n'
              printf '```txt\n%s\n```\n\n' "${FORMAT}"
              if [ -n "${EXAMPLES}" ]; then
                printf '**Examples**\n\n```txt\n%s\n```\n\n' "${EXAMPLES%$'\n'}"
              fi
              if [ -n "${GUIDANCE_URL}" ]; then
                printf 'See [the guidance](%s) for more detail.\n' "${GUIDANCE_URL}"
              fi
            } > "${BODY_FILE}"
          fi

          # Keep a single comment, identified by the marker.
          COMMENT_ID=$(gh api "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" | head -n1)

          if [ -n "${COMMENT_ID}" ]; then
            echo "Updating existing comment ${COMMENT_ID}"
            gh api -X PATCH "repos/${REPOSITORY}/issues/comments/${COMMENT_ID}" -F body=@"${BODY_FILE}" > /dev/null
          elif [ "${VALID}" != "true" ]; then
            echo "Creating guidance comment"
            gh api -X POST "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" -F body=@"${BODY_FILE}" > /dev/null
          fi

      - name: Write summary
        if: steps.validate.outputs.skipped != 'true'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          VALID: ${{ steps.validate.outputs.valid }}
          FORMAT: ${{ inputs.format }}
        run: |
          {
            echo "## PR title"
            echo
            if [ "${VALID}" = "true" ]; then
              echo "✅ \`${TITLE}\` follows the required format."
            else
              echo "❌ \`${TITLE}\` does not follow the required format:"
              echo
              echo "\`\`\`txt"
              echo "${FORMAT}"
              echo "\`\`\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if PR title is invalid
        if: steps.validate.outputs.valid != 'true'
        env:
          FORMAT: ${{ inputs.format }}
        run: |
          echo "::error::PR title must follow the format '${FORMAT}'"
          exit 1