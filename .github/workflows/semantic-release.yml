name: Semantic Release

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version used to run semantic-release"
        required: false
        type: string
        default: "24"

    secrets:
      deployment-role:
        required: false
        description: "Deprecated and unused. Kept so callers that still pass it (v1.1.x) keep working."

    outputs:
      released:
        description: "Whether a new semantic release was created"
        value: ${{ jobs.release.outputs.released }}
      version:
        description: "The new semantic version without the v prefix"
        value: ${{ jobs.release.outputs.version }}
      type:
        description: "The release type: major, minor or patch"
        value: ${{ jobs.release.outputs.type }}

jobs:
  release:
    name: Create semantic release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    concurrency:
      group: ${{ github.repository }}-semantic-release
      cancel-in-progress: false

    outputs:
      released: ${{ steps.semantic-release.outputs.released }}
      version: ${{ steps.semantic-release.outputs.version }}
      type: ${{ steps.semantic-release.outputs.type }}

    steps:
      - name: Checkout calling repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: "pnpm"

      - name: Configure CodeArtifact auth
        uses: govuk-once/platform-actions-codeartifact-login/.github/actions/codeartifact-auth@408ae36872222a323bf4ba0b09397d08af8186b1
        with:
          role-to-assume: ${{ secrets.deployment-role }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run semantic-release
        id: semantic-release
        uses: govuk-once/platform-shared-ci-cd/actions/semantic-release@v1